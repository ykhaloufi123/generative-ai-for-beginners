[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isotestforge"
version = "1.0.0"
description = "Génération orchestrée (IA + moteur déterministe) de tests ISO 8583 pour JMeter (plugin jmeter-iso8583)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "PyYAML>=6", "lxml>=5", "Jinja2>=3", "cryptography>=43",
  "requests>=2.31", "starlette>=0.37", "uvicorn>=0.29", "python-multipart>=0.0.9",
  "openpyxl>=3.1", "python-docx>=1.1", "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
itf = "isotestforge.cli:main"

[tool.setuptools.packages.find]
include = ["isotestforge*"]

[tool.setuptools.package-data]
"isotestforge.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
