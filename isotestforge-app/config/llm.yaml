# Routeur LLM multi-fournisseurs. Chaque tâche démarre sur le niveau le moins cher capable de la faire ;
# escalade vers le niveau supérieur seulement après des échecs de validation.
# Modifiable aussi depuis l'interface (onglet « IA ») : la version enregistrée là-bas est écrite dans
# data/llm_config.yaml et prend le pas sur ce fichier.
enabled: true                 # false = mode 100 % déterministe (heuristiques seulement)

# Fournisseurs disponibles. type : anthropic | openai_compatible (OpenAI, Mistral, Groq, GitHub Models,
# vLLM, Ollama, LiteLLM, modèle interne...). La clé est lue dans la variable d'environnement api_key_env,
# ou saisie dans l'interface. Un fournisseur sans clé est ignoré par le routage (sauf needs_key: false).
providers:
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  mistral:
    type: openai_compatible
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
  groq:
    type: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  github_models:
    type: openai_compatible
    base_url: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
  ollama:                     # modèle local (souveraineté des données), désactivé par défaut
    type: openai_compatible
    base_url: http://localhost:11434/v1
    needs_key: false
    enabled: false

# Niveaux : liste ordonnée de candidats « fournisseur/modèle ». Le routeur prend le premier dont le
# fournisseur est configuré, et passe au suivant si l'appel échoue (panne, quota). Identifiants à ajuster.
tiers:
  light: [anthropic/claude-haiku-5-5, mistral/mistral-small-latest, openai/gpt-4o-mini]
  medium: [anthropic/claude-sonnet-5-5, mistral/mistral-large-latest, openai/gpt-4o]
  heavy: [anthropic/claude-opus-5-5]

routing:                      # tâche -> niveau de départ
  requirement_analysis: light
  scenario_design: medium
  result_diagnosis: medium
  scenario_review: light
  template_proposal: medium

# Plafond de tokens de sortie par tâche (réponse courte = coût réduit) ; défaut : max_output_tokens.
max_output_tokens_by_task:
  requirement_analysis: 2000
  result_diagnosis: 1500
  scenario_review: 1000

escalation:
  max_attempts_per_tier: 2    # corrections ciblées avant de monter d'un niveau
  order: [light, medium, heavy]
  # Demande courte : on commence un niveau plus bas (l'escalade rattrape un éventuel échec).
  downgrade_small_prompts: true
  small_prompt_chars: 1000

# Coût par million de tokens (USD), clé « fournisseur/modèle » ou nom de modèle.
# Tarifs publics standard relevés en octobre 2026 (hors batch, priorité, mode rapide) : à revérifier
# périodiquement sur les pages tarifs des fournisseurs. cache_read = lecture du cache de prompt.
pricing:
  anthropic/claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01}     # jusqu'à 100K tokens d'entrée
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}
  anthropic/claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  openai/gpt-4o-mini: {input: 0.15, output: 0.60, cache_read: 0.075}
  openai/gpt-4o: {input: 2.50, output: 10.00, cache_read: 1.25}
  mistral/mistral-small-latest: {input: 0.15, output: 0.60, cache_read: 0}       # Mistral Small 4
  mistral/mistral-large-latest: {input: 0.50, output: 1.50, cache_read: 0}       # Mistral Large 3, à confirmer

budget:
  max_tokens_per_suite: 200000
  max_tokens_per_day: 2000000

cache:
  exact: true
  semantic: true
  semantic_threshold: 0.92    # similarité minimale pour réutiliser une réponse
  db: data/cache/llm_cache.sqlite

max_output_tokens: 8000
timeout_s: 120
