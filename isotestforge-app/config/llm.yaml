# Routeur LLM. Les tâches sont routées vers le modèle le moins cher capable de les faire ;
# escalade vers le niveau supérieur seulement après des échecs de validation.
enabled: true                 # false = mode 100 % déterministe (heuristiques seulement)
provider: anthropic           # anthropic | openai_compatible (vLLM, Ollama, LiteLLM proxy, modèle interne)
api_key_env: ANTHROPIC_API_KEY
base_url: https://api.anthropic.com
# Pour un modèle hébergé en interne (souveraineté des données) :
# provider: openai_compatible
# base_url: http://llm.interne:8000/v1
# api_key_env: INTERNAL_LLM_KEY

tiers:                        # identifiants de modèles à ajuster selon votre compte / fournisseur
  light: claude-haiku-5-5
  medium: claude-sonnet-5-5
  heavy: claude-opus-5-5

routing:                      # tâche -> niveau de départ
  requirement_analysis: light
  scenario_design: medium
  result_diagnosis: medium
  scenario_review: light

escalation:
  max_attempts_per_tier: 2    # corrections ciblées avant de monter d'un niveau
  order: [light, medium, heavy]

# Coût par million de tokens (USD) — À RENSEIGNER avec vos tarifs réels pour le tableau de bord.
pricing:
  claude-haiku-5-5: {input: 0, output: 0, cache_read: 0}
  claude-sonnet-5-5: {input: 0, output: 0, cache_read: 0}
  claude-opus-5-5: {input: 0, output: 0, cache_read: 0}

budget:
  max_tokens_per_suite: 200000
  max_tokens_per_day: 2000000

cache:
  exact: true
  semantic: true
  semantic_threshold: 0.92    # similarité minimale pour réutiliser une réponse
  db: data/cache/llm_cache.sqlite

max_output_tokens: 8000
timeout_s: 120
