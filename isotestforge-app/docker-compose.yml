# Déploiement mono-serveur : interface web (8080) + simulateur ISO 8583 (8583, pour JMeter depuis votre poste)
services:
  app:
    build: .
    restart: unless-stopped
    ports: ["8080:8080", "8583:8583"]
    environment:
      ITF_BASIC_AUTH: ${ITF_BASIC_AUTH:-}          # ex. testeur:MotDePasseLong
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}    # facultatif : sans clé, mode 100 % règles
      ITF_JMETER_IMAGE: isotestforge-jmeter
    volumes:
      - itf-data:/app/data/workflows
  jmeter:
    build: docker/jmeter
    image: isotestforge-jmeter
    profiles: ["tools"]        # docker compose --profile tools build jmeter
volumes:
  itf-data:
