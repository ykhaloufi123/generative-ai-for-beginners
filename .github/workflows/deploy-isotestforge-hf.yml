name: Deploy ISO-TestForge to Hugging Face Spaces

on:
  push:
    branches: [claude/deploy-iso-testforge-render-q98db8]
    paths: ["isotestforge-app/**", ".github/workflows/deploy-isotestforge-hf.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check HF_TOKEN secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Ajouter le secret HF_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: pip install "huggingface_hub>=0.24"
      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_SPACE_PRIVATE: ${{ vars.HF_SPACE_PRIVATE }}
          ITF_BASIC_AUTH: ${{ secrets.ITF_BASIC_AUTH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python isotestforge-app/deploy/huggingface/deploy_space.py
